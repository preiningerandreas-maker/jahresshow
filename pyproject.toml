[project]
name = "jahresshow"
version = "0.1.0"
description = "Slideshow aus Fotos und Videos mit Musik und Texten als MP4"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bin", "out", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: rendert echte Videos mit FFmpeg"]
