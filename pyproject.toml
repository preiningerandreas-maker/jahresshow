[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashback"
version = "2.0.0"
description = "Slideshow aus Fotos und Videos mit Musik und Texten als MP4"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10",
    "pillow-heif>=0.16",
    "PySide6>=6.6",
]

[project.scripts]
flashback = "slideshow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5"]
# Windows-Paket (build.ps1); feste Version, damit jeder Build gleich ausfällt
build = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["slideshow*"]

[tool.setuptools.package-data]
slideshow = ["assets/fonts/*", "assets/icons/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bin", "out", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: rendert echte Videos mit FFmpeg"]
qt_api = "pyside6"
